# First edition method cards. Keep each card small; add detail only when it changes routing.
- name: User Story
  id: user-story
  type: practice
  domain: requirement
  problem: 将用户目标转成可讨论的价值切片
  signals: [需求以功能清单描述, 用户价值不清]
  artifact: [user_story]
  quality_attribute: [maintainability]
  concept: 从角色、目标和价值描述可交付切片
  when_use: [新增功能, 需求范围模糊]
  avoid: [把实现方案写进故事, 一次覆盖多个独立目标]
  related: [acceptance-criteria, jtbd]
  constraints: [一个故事只表达一个可验证价值]
  benefit: [统一需求语言, 便于拆分]
  risk: [过度简化复杂领域]
  evidence: [review]
  examples: [作为订单用户, 我希望申请退款, 以便在符合规则时收回款项]
- name: Acceptance Criteria
  id: acceptance-criteria
  type: practice
  domain: requirement
  problem: 需求完成标准不可判定
  signals: [反复争论是否完成, 测试只能凭感觉]
  artifact: [acceptance_criteria]
  quality_attribute: [reliability, maintainability]
  concept: 为需求定义可观察的通过条件
  when_use: [用户故事, 高风险规则]
  avoid: [只写实现步骤, 覆盖所有内部细节]
  related: [gwt, test-case]
  constraints: [每条标准必须可测试]
  benefit: [减少歧义, 形成验收证据]
  risk: [遗漏异常路径]
  evidence: [test_result, review]
  examples: [给定已支付订单且在窗口内, 当提交退款, 那么状态变为退款处理中]
- name: Jobs To Be Done
  id: jtbd
  type: heuristic
  domain: requirement
  problem: 需求停留在用户请求而非待完成任务
  signals: [用户只提出方案, 替代方案很多]
  artifact: [requirement, user_story]
  quality_attribute: [maintainability]
  concept: 聚焦用户在情境中要完成的进展
  when_use: [探索需求, 方案尚未确定]
  avoid: [把 JTBD 当成完整规格]
  related: [user-story]
  constraints: [写清情境、动机和期望进展]
  benefit: [避免过早锁定方案]
  risk: [难直接转成技术验收]
  evidence: [review, experiment]
  examples: [在出差中快速确认报销是否可提交]
- name: ADR
  id: adr
  type: practice
  domain: design
  problem: 重要技术取舍只存在于口头讨论
  signals: [同一争议反复出现, 决策理由丢失]
  artifact: [adr]
  quality_attribute: [maintainability]
  concept: 记录背景、决策、后果和替代方案
  when_use: [不可逆或高成本取舍, 架构争议]
  avoid: [把 ADR 写成设计百科]
  related: [trade-off-matrix, rfc]
  constraints: [记录决策时点和未决风险]
  benefit: [可追溯, 降低重复讨论]
  risk: [过时后误导团队]
  evidence: [review, production_signal]
  examples: [选择异步消息而非同步调用]
- name: RFC
  id: rfc
  type: practice
  domain: design
  problem: 跨团队方案需要在实施前获得结构化反馈
  signals: [影响多个边界, 需要公开评论]
  artifact: [rfc]
  quality_attribute: [scalability, security]
  concept: 在决策前公开方案、问题和反馈窗口
  when_use: [跨团队设计, 公共接口变更]
  avoid: [没有决策截止点的无限讨论]
  related: [adr, design-doc]
  constraints: [明确非目标、反馈截止和决策人]
  benefit: [提前发现边界问题]
  risk: [评审成本高]
  evidence: [review]
  examples: [公共 API 版本升级提案]
- name: Design Doc
  id: design-doc
  type: practice
  domain: design
  problem: 复杂实现缺少共享模型和边界
  signals: [组件交互复杂, 实施者理解不一致]
  artifact: [design_doc]
  quality_attribute: [maintainability, scalability]
  concept: 描述目标、架构、接口、数据流和失败模式
  when_use: [复杂功能, 多模块变更]
  avoid: [只描述 happy path]
  related: [adr, rfc]
  constraints: [包含非目标、风险和验证计划]
  benefit: [降低实现偏差]
  risk: [文档与代码漂移]
  evidence: [review, experiment]
  examples: [订单退款领域服务设计]
- name: Trade-off Matrix
  id: trade-off-matrix
  type: practice
  domain: decision
  problem: 多方案取舍被单一偏好主导
  signals: [方案各有优缺点, 争论无法收敛]
  artifact: [decision_matrix, adr]
  quality_attribute: [performance, cost, scalability, maintainability]
  concept: 用显式维度、权重和证据比较方案
  when_use: [架构选择, 工具选择]
  avoid: [伪精确打分, 隐藏权重]
  related: [adr, benchmark]
  constraints: [先定义硬约束再评分]
  benefit: [暴露假设, 支持敏感性分析]
  risk: [主观分数制造确定感]
  evidence: [benchmark, review]
  examples: [CQRS 与 CRUD 对比]
- name: GWT
  id: gwt
  type: practice
  domain: testing
  problem: 行为验收语言不一致
  signals: [验收标准含糊, 场景遗漏]
  artifact: [acceptance_criteria, test_case]
  quality_attribute: [reliability]
  concept: 用 Given-When-Then 表达可观察行为
  when_use: [业务规则, BDD]
  avoid: [把内部实现写成 Then]
  related: [bdd, acceptance-criteria]
  constraints: [每个场景只验证一个行为结果]
  benefit: [业务与测试共享语言]
  risk: [场景数量膨胀]
  evidence: [test_result]
  examples: [给定余额不足, 当支付, 那么交易被拒绝]
- name: AAA
  id: aaa
  type: practice
  domain: testing
  problem: 单元测试结构混乱难读
  signals: [setup 与断言交织, 测试意图不明显]
  artifact: [test_case]
  quality_attribute: [maintainability]
  concept: Arrange-Act-Assert 分隔测试阶段
  when_use: [单元测试, 回归测试]
  avoid: [多个 Act 混在一个测试]
  related: [tdd]
  constraints: [一个测试聚焦一个行为]
  benefit: [提升可读性]
  risk: [复杂集成场景不适用]
  evidence: [test_result, review]
  examples: [准备订单, 调用退款, 断言状态]
- name: TDD
  id: tdd
  type: practice
  domain: testing
  problem: 实现先行导致反馈晚和接口难测
  signals: [代码难测试, 回归缺口]
  artifact: [test_case, source_code]
  quality_attribute: [reliability, maintainability]
  concept: Red-Green-Refactor 的短反馈循环
  when_use: [规则密集逻辑, 可测试模块]
  avoid: [为追求覆盖率测试实现细节]
  related: [aaa, refactoring]
  constraints: [先写失败测试, 保持循环小]
  benefit: [快速反馈, 促成可测试设计]
  risk: [探索性 UI 或外部集成成本高]
  evidence: [test_result]
  examples: [先定义退款边界再实现]
- name: BDD
  id: bdd
  type: practice
  domain: testing
  problem: 业务意图与自动化测试脱节
  signals: [测试术语只有开发者理解]
  artifact: [acceptance_criteria, test_case]
  quality_attribute: [reliability, maintainability]
  concept: 以共享行为场景驱动协作和验证
  when_use: [跨角色协作, 复杂业务规则]
  avoid: [把 BDD 变成工具语法培训]
  related: [gwt, acceptance-criteria]
  constraints: [场景来自真实业务规则]
  benefit: [减少需求-测试鸿沟]
  risk: [场景维护成本]
  evidence: [test_result, review]
  examples: [退款窗口与重复申请场景]
- name: Test Pyramid
  id: test-pyramid
  type: heuristic
  domain: testing
  problem: 测试慢、脆弱且反馈层级失衡
  signals: [端到端测试过多, 单测缺失]
  artifact: [test_strategy]
  quality_attribute: [reliability, cost]
  concept: 以更多快速低层测试支撑少量高层测试
  when_use: [测试策略设计, CI 变慢]
  avoid: [机械固定比例]
  related: [tdd, test-case]
  constraints: [按反馈速度和风险分层]
  benefit: [更快反馈, 降低脆弱性]
  risk: [低层测试遗漏真实集成问题]
  evidence: [test_result, metric]
  examples: [单元为主, 关键流程少量 E2E]
- name: SOLID
  id: solid
  type: heuristic
  domain: coding
  problem: 变更导致模块耦合和理解成本上升
  signals: [类职责膨胀, 依赖难替换]
  artifact: [source_code]
  quality_attribute: [maintainability]
  concept: 一组面向可维护设计的原则
  when_use: [持续变更模块, 设计评审]
  avoid: [为满足原则过度抽象]
  related: [refactoring]
  constraints: [以真实变化轴为抽象依据]
  benefit: [降低变更影响面]
  risk: [抽象数量增加]
  evidence: [review, test_result]
  examples: [按支付方式拆分策略]
- name: DRY
  id: dry
  type: heuristic
  domain: coding
  problem: 同一知识在多处复制后发生漂移
  signals: [重复规则, 修改需多点同步]
  artifact: [source_code]
  quality_attribute: [maintainability]
  concept: 统一重复的领域知识而非盲目消除相似代码
  when_use: [重复规则稳定且语义相同]
  avoid: [过早抽象相似但不同的代码]
  related: [kiss, refactoring]
  constraints: [确认重复的是知识而非形状]
  benefit: [减少漂移]
  risk: [错误共享抽象]
  evidence: [review, test_result]
  examples: [统一退款资格规则]
- name: KISS
  id: kiss
  type: heuristic
  domain: coding
  problem: 方案复杂度超过问题需要
  signals: [层次过多, 简单需求引入框架]
  artifact: [source_code, design_doc]
  quality_attribute: [maintainability, cost]
  concept: 选择足够解决问题的最简单方案
  when_use: [低不确定性, 早期实现]
  avoid: [用简单掩盖真实复杂度]
  related: [yagni, trade-off-matrix]
  constraints: [记录被省略的能力与升级信号]
  benefit: [降低认知和维护成本]
  risk: [未来扩展不足]
  evidence: [review, production_signal]
  examples: [先用 CRUD 而非 CQRS]
- name: YAGNI
  id: yagni
  type: heuristic
  domain: coding
  problem: 为未证实需求提前建设
  signals: [未来可能需要, 配置和抽象泛化]
  artifact: [source_code, design_doc]
  quality_attribute: [cost, maintainability]
  concept: 只为已验证需求承担当前复杂度
  when_use: [需求不确定, 资源有限]
  avoid: [忽略已知合规或容量约束]
  related: [kiss]
  constraints: [写出未来需求出现时的升级触发器]
  benefit: [减少过度工程]
  risk: [错过不可逆准备]
  evidence: [review, metric]
  examples: [不为未知租户模型先建复杂分片]
- name: Refactoring
  id: refactoring
  type: practice
  domain: coding
  problem: 在不改变行为时降低结构性变更成本
  signals: [重复, 命名混乱, 测试难写]
  artifact: [source_code, test_case]
  quality_attribute: [maintainability]
  concept: 以测试保护为边界改善内部结构
  when_use: [行为已有测试, 变更前后]
  avoid: [借重构之名改变业务行为]
  related: [tdd, solid]
  constraints: [小步提交, 每步运行相关测试]
  benefit: [降低后续变更风险]
  risk: [范围蔓延]
  evidence: [test_result, review]
  examples: [提取退款策略]
- name: Repository
  id: repository
  type: pattern
  domain: design
  problem: 领域逻辑依赖持久化细节
  signals: [业务代码到处写 SQL, 难替换存储]
  artifact: [source_code, design_doc]
  quality_attribute: [maintainability, testability]
  concept: 用集合式接口隔离领域与数据访问
  when_use: [领域逻辑复杂, 多种存储实现]
  avoid: [为简单 CRUD 建过厚抽象]
  related: [solid]
  constraints: [接口表达领域意图而非 ORM API]
  benefit: [隔离变化, 易测试]
  risk: [泄漏查询能力或抽象失真]
  evidence: [test_result, review]
  examples: [OrderRepository.findRefundable]
- name: CQRS
  id: cqrs
  type: pattern
  domain: design
  problem: 读写模型约束冲突或扩展特征不同
  signals: [查询复杂, 读写负载差异大]
  artifact: [design_doc, adr, source_code]
  quality_attribute: [scalability, performance]
  concept: 分离命令模型与查询模型
  when_use: [读写明显不对称, 独立扩展有收益]
  avoid: [仅因流行而引入]
  related: [trade-off-matrix, benchmark]
  constraints: [明确一致性和同步延迟预算]
  benefit: [独立优化读写]
  risk: [数据同步复杂度]
  evidence: [benchmark, production_signal]
  examples: [订单写模型与报表读模型]
- name: Circuit Breaker
  id: circuit-breaker
  type: pattern
  domain: operation
  problem: 下游故障引发级联超时
  signals: [重试风暴, 线程池耗尽]
  artifact: [source_code, runbook]
  quality_attribute: [reliability, observability]
  concept: 失败达到阈值时快速失败并探测恢复
  when_use: [远程依赖, 故障隔离]
  avoid: [没有降级语义就吞错]
  related: [incident-response]
  constraints: [定义阈值、半开策略和告警]
  benefit: [阻止级联故障]
  risk: [误判导致可用性下降]
  evidence: [metric, production_signal]
  examples: [支付服务熔断]
- name: RCA
  id: rca
  type: process
  domain: debug
  problem: 只修表象，根因反复出现
  signals: [同类事故重复, 修复无法解释故障]
  artifact: [incident_report]
  quality_attribute: [reliability, maintainability]
  concept: 通过证据链解释触发、传播和失效边界
  when_use: [重大或重复故障]
  avoid: [寻找单一责怪对象]
  related: [five-whys, fault-tree, postmortem]
  constraints: [区分事实、假设和根因]
  benefit: [形成系统性改进]
  risk: [事后叙事偏差]
  evidence: [log, metric, production_signal]
  examples: [支付超时根因复盘]
- name: Five Whys
  id: five-whys
  type: heuristic
  domain: debug
  problem: 描述停留在表层症状
  signals: [问题陈述过于宽泛]
  artifact: [incident_report]
  quality_attribute: [reliability]
  concept: 连续追问因果以逼近可行动原因
  when_use: [单一链路, 快速初步分析]
  avoid: [机械追问五次, 无证据继续推测]
  related: [rca]
  constraints: [每一层都要有证据或标记假设]
  benefit: [快速暴露缺口]
  risk: [复杂多因故障过度简化]
  evidence: [log, review]
  examples: [为何超时→为何重试→为何未熔断]
- name: Fault Tree Analysis
  id: fault-tree
  type: practice
  domain: debug
  problem: 多个故障组合导致顶层事故
  signals: [并发失效, 安全或可靠性关键]
  artifact: [incident_report, design_doc]
  quality_attribute: [reliability, security]
  concept: 用 AND/OR 逻辑从顶层故障反推基本事件
  when_use: [高风险系统, 多因故障]
  avoid: [没有边界就无限展开]
  related: [rca, risk-matrix]
  constraints: [先定义顶层事件和分析边界]
  benefit: [系统化覆盖组合路径]
  risk: [建模成本高]
  evidence: [review, experiment, production_signal]
  examples: [支付不可用故障树]
- name: Hypothesis-Driven Debugging
  id: hypothesis-driven-debugging
  type: practice
  domain: debug
  problem: 排障依赖猜测和无序尝试
  signals: [反复改动, 无法复盘尝试结果]
  artifact: [incident_report, experiment, log]
  quality_attribute: [reliability, observability]
  concept: 记录假设、预测、最小探测和结果
  when_use: [难复现, 复杂故障]
  avoid: [一次改变多个变量]
  related: [rca, experiment]
  constraints: [每次实验必须有判别性预测]
  benefit: [加快收敛并保留证据]
  risk: [探测本身影响生产]
  evidence: [experiment, log, metric]
  examples: [区分连接池耗尽与下游延迟]
- name: Incident Response
  id: incident-response
  type: process
  domain: operation
  problem: 生产事故中缺少角色、沟通和止损路径
  signals: [多人同时操作, 状态不透明]
  artifact: [incident_report, runbook]
  quality_attribute: [reliability, observability]
  concept: 以分工、升级、缓解和恢复组织事故处理
  when_use: [生产影响, 用户可见故障]
  avoid: [事故中追求完美根因]
  related: [runbook, postmortem]
  constraints: [先恢复服务, 保留时间线和决策记录]
  benefit: [降低影响和协调成本]
  risk: [流程过重延误缓解]
  evidence: [metric, log, production_signal]
  examples: [支付超时事故指挥]
- name: Postmortem
  id: postmortem
  type: process
  domain: operation
  problem: 事故结束后改进事项无人负责
  signals: [同类事故复发, 复盘只写总结]
  artifact: [incident_report]
  quality_attribute: [reliability, maintainability]
  concept: 无责备地记录影响、时间线、根因和行动项
  when_use: [重大事故后, 重复事故后]
  avoid: [把复盘写成责任追究]
  related: [rca, incident-response]
  constraints: [行动项有 owner、截止期和验证方式]
  benefit: [把事故转成系统改进]
  risk: [行动项堆积]
  evidence: [review, production_signal]
  examples: [补充熔断和超时指标]
- name: Runbook
  id: runbook
  type: process
  domain: operation
  problem: 常见运维动作依赖个人记忆
  signals: [值班交接困难, 操作步骤不一致]
  artifact: [runbook, handoff]
  quality_attribute: [reliability, observability]
  concept: 为重复操作提供前置条件、步骤、判断和回滚
  when_use: [高频运维, 应急操作]
  avoid: [只列命令不写判断条件]
  related: [incident-response]
  constraints: [每步有成功信号和停止条件]
  benefit: [降低人为差异]
  risk: [过期指令造成风险]
  evidence: [review, production_signal]
  examples: [支付服务降级操作]
- name: Code Review
  id: code-review
  type: practice
  domain: review
  problem: 变更风险在合并前未被独立发现
  signals: [高风险代码缺少第二双眼睛]
  artifact: [review, source_code]
  quality_attribute: [reliability, security, maintainability]
  concept: 基于目标和证据检查变更正确性与可维护性
  when_use: [共享代码, 高风险变更]
  avoid: [只评论格式或个人偏好]
  related: [adr, test-strategy]
