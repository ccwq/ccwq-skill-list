<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PROTOTYPE · Router V3 授权与派生额度</title>
<style>
  :root { font-family: "Segoe UI", system-ui, sans-serif; color: #12202f; background: #f5f8fb; }
  body { max-width: 960px; margin: 0 auto; padding: 32px 20px 56px; } section { background: #fff; border: 1px solid #dce6ef; border-radius: 10px; padding: 18px; margin-top: 18px; }
  button { margin: 4px; padding: 8px 10px; border: 1px solid #91aabe; border-radius: 7px; background: #fff; cursor: pointer; color: #163b56; } button.primary { background: #0d689e; color: white; }
  dl { display: grid; grid-template-columns: 160px 1fr; gap: 8px 12px; } dt { color: #526778; } dd { margin: 0; font-weight: 600; } pre { white-space: pre-wrap; background: #102333; color: #e9f5ff; border-radius: 6px; padding: 12px; }
</style>
<body>
  <h1>Router V3 · 一次授权与派生额度</h1>
  <p>原型演示：预览后只有独立 <code>okok</code> 生效；模型、范围或派生额度变化会使旧授权失效。Luna 可以成为叶节点，但不能创建子智能体。</p>
  <section><h2>当前状态</h2><dl id="state"></dl><pre id="event"></pre></section>
  <section><h2>操作</h2><div id="buttons"></div></section>
<script>
const sensitive = ['model', 'scope', 'permission', 'validation', 'maxDepth', 'maxWorkers'];
const initialState = () => ({ phase: '讨论中', preview: null, authorized: false, dispatched: false, event: '从讨论开始；尚未展示执行预览。' });
const plan = { model: 'terra', scope: 'docs/audit.md', permission: 'read', validation: 'unit test', maxDepth: 2, maxWorkers: 5 };
const fingerprint = value => sensitive.map(key => key + '=' + value[key]).join('|');
function reduce(state, action) {
  const next = structuredClone(state);
  if (action.type === 'PRESENT') { next.preview = { plan: { ...plan }, fingerprint: fingerprint(plan) }; next.authorized = false; next.phase = '待授权'; next.event = '预览已展示；等待独立 okok。'; }
  if (action.type === 'AUTHORIZE') next.event = !next.preview ? '拒绝：没有当前预览。' : (next.authorized = true, 'okok 已绑定当前预览。');
  if (action.type === 'CHANGE') {
    if (!next.preview) next.event = '尚无预览，只记录变更。';
    else { next.preview.plan[action.field] = action.value; next.preview.fingerprint = fingerprint(next.preview.plan); next.authorized = false; next.phase = '待授权'; next.event = '授权敏感字段已变更；必须重发预览并重新 okok。'; }
  }
  if (action.type === 'LUNA') next.event = '拒绝：Luna 不能派生子智能体。';
  if (action.type === 'DISPATCH') {
    if (!next.preview) next.event = '拒绝：没有当前预览。';
    else if (!next.authorized) next.event = '拒绝：没有绑定当前预览的 okok。';
    else { next.dispatched = true; next.phase = '执行中'; next.event = '允许：Terra/Sol 可在预览额度内原生派生。'; }
  }
  return next;
}
let state = initialState();
const actions = [['展示预览', { type: 'PRESENT' }, 'primary'], ['授权 okok', { type: 'AUTHORIZE' }, 'primary'], ['改模型', { type: 'CHANGE', field: 'model', value: 'sol' }], ['改额度', { type: 'CHANGE', field: 'maxWorkers', value: 8 }], ['Luna 派生', { type: 'LUNA' }], ['尝试分发', { type: 'DISPATCH' }, 'primary']];
function render() {
  document.querySelector('#state').innerHTML = [['阶段', state.phase], ['预览', state.preview ? state.preview.fingerprint : '无'], ['授权', state.authorized ? '有效' : '无效'], ['已分发', state.dispatched ? '是' : '否']].map(pair => '<dt>' + pair[0] + '</dt><dd>' + pair[1] + '</dd>').join('');
  document.querySelector('#event').textContent = state.event;
  document.querySelector('#buttons').innerHTML = '<button onclick="resetAll()">重置</button>' + actions.map(item => '<button class="' + (item[2] || '') + '" onclick="act(' + JSON.stringify(item[1]).replace(/"/g, '&quot;') + ')">' + item[0] + '</button>').join('');
}
function act(action) { state = reduce(state, action); render(); }
function resetAll() { state = initialState(); render(); }
render();
</script>
</body></html>
